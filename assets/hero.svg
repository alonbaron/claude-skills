<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">alon-skills — six Claude Code skills, one install</title>
<desc id="d">A blueprint-style banner for the alon-skills plugin: the wordmark alon-skills in a cyan-to-violet gradient over a steel grid, framed by corner brackets, listing six slash commands. Tagline: model-first, failure-path-aware, YAGNI.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F5F8FC"/><stop offset=".5" stop-color="#EDF3FB"/><stop offset="1" stop-color="#E9EEF9"/>
  </linearGradient>
  <linearGradient id="wm" x1="230" y1="0" x2="670" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0891B2"/><stop offset=".34" stop-color="#0EA5E9"/><stop offset=".64" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0891B2" stop-opacity="0"/><stop offset=".2" stop-color="#0891B2"/><stop offset=".5" stop-color="#4F46E5"/><stop offset=".8" stop-color="#C026D3"/><stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="gCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 70) scale(360 220)">
    <stop stop-color="#0891B2" stop-opacity=".12"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gMag" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 250) scale(360 220)">
    <stop stop-color="#C026D3" stop-opacity=".1"/><stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
  </radialGradient>
  <pattern id="minor" width="15" height="15" patternUnits="userSpaceOnUse">
    <path d="M15 0H0V15" fill="none" stroke="#C4D3E6" stroke-width=".6" stroke-opacity=".5"/>
  </pattern>
  <pattern id="major" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="#AFC3DD" stroke-width=".9" stroke-opacity=".55"/>
  </pattern>
  <filter id="drop" x="-20%" y="-40%" width="140%" height="200%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#1E3A5F" flood-opacity=".14"/>
  </filter>
  <clipPath id="nameClip"><text x="450" y="158" text-anchor="middle" class="wmark">alon-skills</text></clipPath>
  <clipPath id="screen"><rect x="18" y="18" width="864" height="264" rx="16"/></clipPath>
  <style><![CDATA[
    .mono{font-family:ui-monospace,'Cascadia Code','Segoe UI Mono',Consolas,'Courier New',monospace}
    .wmark{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:80px;letter-spacing:1px}
    .sheen{animation:sweep 5.5s ease-in-out infinite}
    .cur{animation:blink 1.1s steps(1) infinite}
    .liveDot{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .liveRing{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .scan{animation:scan 7s linear infinite}
    @keyframes sweep{0%{transform:translateX(-300px)}55%,100%{transform:translateX(760px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
    @keyframes ring{0%{opacity:.55;transform:scale(.7)}75%,100%{opacity:0;transform:scale(2.8)}}
    @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(248px)}}
    @media (prefers-reduced-motion:reduce){.sheen,.cur,.liveDot,.liveRing,.scan{animation:none}.liveRing{opacity:0}}
  ]]></style>
</defs>

<rect width="900" height="300" fill="url(#bg)"/>
<g clip-path="url(#screen)">
  <rect width="900" height="300" fill="url(#minor)"/>
  <rect width="900" height="300" fill="url(#major)"/>
  <rect width="900" height="300" fill="url(#gCyan)"/>
  <rect width="900" height="300" fill="url(#gMag)"/>
  <rect class="scan" x="18" y="18" width="864" height="40" fill="#0891B2" opacity=".05"/>
</g>

<rect x="18" y="18" width="864" height="264" rx="16" fill="none" stroke="#CBD9EA"/>
<g stroke="#0891B2" stroke-width="2" fill="none" stroke-linecap="round" stroke-opacity=".9">
  <path d="M30 64V36a6 6 0 0 1 6-6h28"/>
  <path d="M836 30h28a6 6 0 0 1 6 6v28"/>
  <path d="M870 236v28a6 6 0 0 1-6 6h-28"/>
  <path d="M64 270H36a6 6 0 0 1-6-6v-28"/>
</g>

<!-- top status bar -->
<g class="mono" font-size="11.5" letter-spacing="1.5">
  <circle class="liveRing" cx="50" cy="49" r="4.5" fill="#059669"/>
  <circle class="liveDot" cx="50" cy="49" r="4.5" fill="#059669"/>
  <text x="64" y="53" fill="#047857" font-weight="bold">SKILLS ONLINE</text>
  <text x="852" y="53" text-anchor="end" fill="#5B6B86">CLAUDE CODE<tspan fill="#9DB0CC">  //  </tspan>PLUGIN MARKETPLACE</text>
</g>

<!-- wordmark + sheen -->
<text x="450" y="158" text-anchor="middle" class="wmark" fill="url(#wm)" filter="url(#drop)">alon-skills</text>
<g clip-path="url(#nameClip)"><rect class="sheen" x="210" y="84" width="140" height="92" fill="url(#sheen)"/></g>

<!-- animated underline -->
<rect x="320" y="178" width="260" height="2.5" rx="1.25" fill="url(#rule)"/>

<!-- subtitle + command list -->
<g text-anchor="middle">
  <text x="450" y="208" class="mono" font-size="13" letter-spacing="4" fill="#334A66">SIX CLAUDE CODE SKILLS · ONE INSTALL</text>
  <text x="450" y="234" class="mono" font-size="11.5" fill="#0891B2">&gt; <tspan fill="#0891B2">/architect</tspan> · <tspan fill="#0284C7">/review-swarm</tspan> · <tspan fill="#4F46E5">/ask-the-council</tspan> · <tspan fill="#6D28D9">/prompt-generator</tspan> · <tspan fill="#7C3AED">/up-to-date</tspan> · <tspan fill="#C026D3">/ponytail</tspan><tspan class="cur" fill="#C026D3">_</tspan></text>
</g>

<!-- telemetry row -->
<g class="mono" font-size="11" letter-spacing=".5" text-anchor="middle">
  <text x="170" y="270" fill="#7688A3">BUILD · <tspan fill="#334A66">MODEL-FIRST</tspan></text>
  <text x="450" y="270" fill="#7688A3">FAILURE-PATHS · <tspan fill="#334A66">BY DESIGN</tspan></text>
  <text x="730" y="270" fill="#7688A3">LICENSE · <tspan fill="#334A66">MIT</tspan></text>
</g>
</svg>

<svg width="1280" height="520" viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">claude plugin eval suite — 19 behavioral cases and 120 trigger queries on Fable 5.1</title>
<desc id="d">Telemetry dashboard of all 19 behavioral eval cases across the 6 skills (ponytail vendored from DietrichGebert/ponytail MIT, ask-the-council, prompt-generator, architect, review-swarm, up-to-date), scored with and without the plugin at the 0.7 threshold on Fable 5.1, plus trigger accuracy across 120 queries (20 per skill).</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#050814"/>
    <stop offset=".5" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#0E1024"/>
  </linearGradient>
  <radialGradient id="gA" cx="220" cy="120" r="460" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#125190" stop-opacity=".35"/>
    <stop offset="1" stop-color="#125190" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gB" cx="1060" cy="400" r="480" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".25"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">

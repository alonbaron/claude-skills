# Fails when a skill's `description` plus `when_to_use` is over 600 characters (the cap is in the script).
# No secrets, no Claude calls.
name: listing-length
on:
  workflow_dispatch:
  # Push only: a branch with a PR open would otherwise run the job twice.
  push:
    paths: ["skills/**", ".github/scripts/check-listing-length.mjs", ".github/workflows/listing-length.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Each skill's listing text is under the cap
        run: node .github/scripts/check-listing-length.mjs
